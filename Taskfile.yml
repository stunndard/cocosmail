version: '2'

tasks:
  build:
    cmds:
      - go build -o dist/cocosmail

  # fully static binary, runs on any Linux (old distros, Alpine, scratch containers)
  # sqlite needs cgo, so it's linked statically by the external linker.
  # netgo/osusergo: pure Go DNS resolver and user lookup, no glibc NSS at runtime.
  # goffi_static: vtui's FFI layer would otherwise force dynamic linking.
  build-static:
    env:
      CGO_ENABLED: 1
    cmds:
      - go build -trimpath -tags 'netgo osusergo sqlite_omit_load_extension goffi_static' -ldflags '-s -w -linkmode external -extldflags "-static"' -o dist/cocosmail

  run:
    deps: [build]
    dir: dist
    cmds:
      - source conf/cocosmail.cfg && ./cocosmail

  builddist:
    deps: [build]
    cmds:
      - zip -r cocosmail.zip dist/conf/cocosmail.cfg.base
      - zip -r cocosmail.zip dist/ssl
      - zip -r cocosmail.zip dist/tpl
      - zip -r cocosmail.zip dist/run
      - zip -r cocosmail.zip dist/cocosmail

  deploy:
    deps: [build]
    cmds:
      - rsync dist/cocosmail root@51.15.212.212:/home/cocosmail/dist/cocosmail
      - ssh root@51.15.212.212 setcap cap_net_bind_service=+ep /home/cocosmail/dist/cocosmail
      - ssh root@51.15.212.212 systemctl restart cocosmail